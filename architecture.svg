<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="680" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="36" fill="#e0e0e0" font-size="18" font-weight="bold" text-anchor="middle">ForgeMesh Architecture</text>
  <text x="360" y="54" fill="#666" font-size="11" text-anchor="middle">Infrastructure for monetized agent ecosystems</text>

  <!-- Layer 1: Agent -->
  <rect x="240" y="72" width="240" height="42" rx="6" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="360" y="98" fill="#4a9eff" font-size="14" font-weight="bold" text-anchor="middle">AI Agent / Orchestrator</text>

  <!-- Arrow 1 -->
  <line x1="360" y1="114" x2="360" y2="138" stroke="#444" stroke-width="1.5"/>
  <polygon points="354,134 360,142 366,134" fill="#444"/>
  <text x="376" y="132" fill="#555" font-size="10">MCP (stdio)</text>

  <!-- Layer 2: ForgeMesh Packages -->
  <rect x="60" y="144" width="600" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="164" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="bold">FORGEMESH PACKAGES</text>

  <!-- Package boxes -->
  <rect x="80" y="176" width="175" height="60" rx="5" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="168" y="197" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">affiliate-router-mcp</text>
  <text x="168" y="213" fill="#8b949e" font-size="10" text-anchor="middle">8 tools · 3 adapters</text>
  <text x="168" y="227" fill="#8b949e" font-size="10" text-anchor="middle">routing + attribution</text>

  <rect x="272" y="176" width="175" height="60" rx="5" fill="none" stroke="#3fb950" stroke-width="1.2"/>
  <text x="360" y="197" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">coinopai-mcp</text>
  <text x="360" y="213" fill="#8b949e" font-size="10" text-anchor="middle">9 tools · x402 payments</text>
  <text x="360" y="227" fill="#8b949e" font-size="10" text-anchor="middle">crypto intelligence</text>

  <rect x="464" y="176" width="175" height="60" rx="5" fill="none" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="552" y="197" fill="#d2a8ff" font-size="12" font-weight="bold" text-anchor="middle">forgemesh-imagegen</text>
  <text x="552" y="213" fill="#8b949e" font-size="10" text-anchor="middle">x402 gated service</text>
  <text x="552" y="227" fill="#8b949e" font-size="10" text-anchor="middle">image generation</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="254" x2="360" y2="278" stroke="#444" stroke-width="1.5"/>
  <polygon points="354,274 360,282 366,274" fill="#444"/>

  <!-- Layer 3: Adapters -->
  <rect x="100" y="284" width="520" height="90" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="304" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="bold">PAYMENT ADAPTERS</text>

  <rect x="118" y="314" width="150" height="44" rx="4" fill="none" stroke="#f0883e" stroke-width="1.2"/>
  <text x="193" y="333" fill="#f0883e" font-size="11" font-weight="bold" text-anchor="middle">x402_pyrimid</text>
  <text x="193" y="349" fill="#8b949e" font-size="10" text-anchor="middle">on-chain USDC splits</text>

  <rect x="285" y="314" width="150" height="44" rx="4" fill="none" stroke="#f0883e" stroke-width="1"/>
  <text x="360" y="333" fill="#da8f6e" font-size="11" text-anchor="middle">x402_direct</text>
  <text x="360" y="349" fill="#8b949e" font-size="10" text-anchor="middle">EIP-3009 payments</text>

  <rect x="452" y="314" width="150" height="44" rx="4" fill="none" stroke="#f0883e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="527" y="333" fill="#da8f6e" font-size="11" text-anchor="middle">referral_link</text>
  <text x="527" y="349" fill="#8b949e" font-size="10" text-anchor="middle">URL param injection</text>

  <!-- Arrow 3 -->
  <line x1="360" y1="374" x2="360" y2="398" stroke="#444" stroke-width="1.5"/>
  <polygon points="354,394 360,402 366,394" fill="#444"/>

  <!-- Layer 4: Vendor APIs -->
  <rect x="140" y="404" width="440" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="424" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="bold">VENDOR APIS / SERVICES</text>

  <text x="230" y="448" fill="#e0e0e0" font-size="11" text-anchor="middle">x402.coinopai.com</text>
  <text x="230" y="462" fill="#666" font-size="10" text-anchor="middle">7 paid endpoints</text>

  <text x="490" y="448" fill="#e0e0e0" font-size="11" text-anchor="middle">imagegen.coinopai.com</text>
  <text x="490" y="462" fill="#666" font-size="10" text-anchor="middle">$0.10/image</text>

  <!-- Arrow 4 -->
  <line x1="360" y1="474" x2="360" y2="498" stroke="#444" stroke-width="1.5"/>
  <polygon points="354,494 360,502 366,494" fill="#444"/>

  <!-- Layer 5: Settlement -->
  <rect x="160" y="504" width="400" height="52" rx="8" fill="none" stroke="#f78166" stroke-width="1.2"/>
  <text x="360" y="526" fill="#f78166" font-size="12" font-weight="bold" text-anchor="middle">On-Chain Settlement (Base)</text>
  <text x="360" y="543" fill="#8b949e" font-size="10" text-anchor="middle">USDC · EIP-3009 · Pyrimid affiliate splits · Coinbase facilitator</text>

  <!-- Side: Telemetry -->
  <line x1="360" y1="556" x2="360" y2="580" stroke="#444" stroke-width="1.5"/>
  <polygon points="354,576 360,584 366,576" fill="#444"/>

  <rect x="200" y="586" width="320" height="42" rx="6" fill="none" stroke="#7ee787" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="607" fill="#7ee787" font-size="12" text-anchor="middle">Telemetry + Attribution</text>
  <text x="360" y="621" fill="#666" font-size="10" text-anchor="middle">local JSONL logs · per-call tracking · commission estimates</text>

  <!-- Footer -->
  <text x="360" y="660" fill="#444" font-size="10" text-anchor="middle">github.com/forgemeshlabs · Each package works standalone</text>
</svg>
