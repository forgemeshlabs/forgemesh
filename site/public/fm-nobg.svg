  <defs>
    <radialGradient id="dot" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f9fcff"/>
      <stop offset="100%" stop-color="#dcefff"/>
    </radialGradient>
    <radialGradient id="core" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#7fc9f6"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .dot {
        animation: dot-surge 2.65s ease-out infinite;
        filter: url(#softGlow);
        transform-box: fill-box;
        transform-origin: center;
      }

      .core {
        animation: core-surge 2.65s ease-out infinite;
      }

      @keyframes dot-surge {
        0%, 72%, 100% { opacity: 0.42; transform: scale(0.9); }
        24% { opacity: 1; transform: scale(1.18); }
      }

      @keyframes core-surge {
        0%, 72%, 100% { transform: scale(0.9); }
        24% { transform: scale(1.3); }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot, .core { animation: none; }
      }
    </style>
  </defs>
