<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ForgeMesh">
  <defs>
    <radialGradient id="dot" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#d7ecff"/>
    </radialGradient>
    <radialGradient id="core" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#f3faff"/>
      <stop offset="100%" stop-color="#62b8f2"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .dot {
        animation: dot-surge 3.4s ease-out infinite;
        filter: url(#softGlow);
        transform-box: fill-box;
        transform-origin: center;
      }

      .core {
        animation: core-surge 3.4s ease-out infinite;
      }

      @keyframes dot-surge {
        0%, 72%, 100% {
          opacity: 0.78;
          transform: scale(0.96);
        }

        24% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @keyframes core-surge {
        0%, 72%, 100% {
          transform: scale(0.96);
        }

        24% {
          transform: scale(1.18);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot,
        .core {
          animation: none;
        }
      }
    </style>
  </defs>

  <circle class="dot" cx="250" cy="98" r="5.78" fill="url(#dot)" style="animation-delay: 0.95s"/>

